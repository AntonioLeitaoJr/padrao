name: Regras eleitorais — Fases 2 a 5
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fase2:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: comara_fase2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: comara_fase2_test
      DB_USER: root
      DB_PASS: test
      FASE2_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - name: PHP e MySQL
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-mysql php-mbstring
      - name: Sintaxe PHP e JavaScript
        run: |
          find src views config public database tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/assets/js/main.js
          node --check public/assets/js/fase4.js
          node --check public/assets/js/fase5.js
      - name: Assets offline (CSS, fontes e JavaScript)
        run: |
          php tests/teste_assets_intranet.php
          php -S 127.0.0.1:8876 -t public >/tmp/comara-assets-http.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" || true' EXIT
          sleep 1
          for recurso in \
            assets/vendor/bootstrap/5.3.3/css/bootstrap.min.css \
            assets/vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css \
            assets/vendor/bootstrap-icons/1.11.3/fonts/bootstrap-icons.woff2 \
            assets/vendor/bootstrap-icons/1.11.3/fonts/bootstrap-icons.woff \
            assets/css/style.css \
            assets/vendor/bootstrap/5.3.3/js/bootstrap.bundle.min.js; do
            curl --fail --silent --show-error --location "http://127.0.0.1:8876/$recurso" --output /dev/null
          done
      - name: Regras de classificação e desempate
        run: php tests/teste_fase2_regras_unitarias.php
      - name: Persistência, permissões e passagem à urna
        run: php tests/teste_fase2_integracao.php
      - name: Validação independente das ordenações
        run: php tests/teste_ordenacao_estado_maior.php
      - name: Urna em banco descartável separado
        env:
          DB_NAME: comara_fase34_test
          FASE34_TEST_DB: '1'
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'CREATE DATABASE comara_fase34_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/teste_composicao_fase4.php
      - name: Cadastro, RH e unicidade em banco descartável
        env:
          DB_NAME: comara_cadastro_test
          CADASTRO_TEST_DB: '1'
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'CREATE DATABASE comara_cadastro_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/teste_cadastro_integracao.php
      - name: Login de civis e troca obrigatória de senha (banco descartável)
        env:
          DB_NAME: comara_auth_test
          AUTH_TEST_DB: '1'
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'CREATE DATABASE comara_auth_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/teste_auth_integracao.php
      - name: Importação CSV integral em MySQL descartável
        env:
          DB_NAME: comara_csv_test
          CSV_TEST_DB: '1'
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'CREATE DATABASE comara_csv_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/teste_importacao_csv_integracao.php
      - name: Zeramento operacional em MySQL descartável
        env:
          DB_NAME: comara_reset_test
          RESET_TEST_DB: '1'
        run: |
          mysql -h127.0.0.1 -uroot -ptest -e 'CREATE DATABASE comara_reset_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tests/teste_zeramento_integracao.php
